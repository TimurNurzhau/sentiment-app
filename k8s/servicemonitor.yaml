apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sentiment-monitor
  namespace: monitoring
  labels:
    release: kube-prom
spec:
  namespaceSelector:
    matchNames: ["default"]
  selector:
    matchLabels:
      app: sentiment-app
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s